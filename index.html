<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baytaka Interiores | Em Construção</title>

  <meta name="description" content="Baytaka Interiores - Mobiliário e estruturas para eventos. Em construção. Volte em breve.">
  <meta name="robots" content="noindex, follow">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/images/baytaka-logo-raw.jpg">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0d14;
      --border-accent: rgba(255, 106, 0, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --orange-primary: #ff6a00;
      --orange-light: #ffa14a;
      --orange-gradient: linear-gradient(135deg, #ffa14a 0%, #ff6a00 50%, #d44a00 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-pulse: #ff6a00;
      --shadow-glow: 0 0 60px -10px rgba(255, 106, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Fundo dinâmico com iluminação suave */
    .bg-lights {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .light-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.22;
      animation: floatPulse 12s ease-in-out infinite alternate;
    }

    .light-orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #ff6a00 0%, transparent 70%);
      top: -150px;
      right: -100px;
    }

    .light-orb-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
      bottom: -100px;
      left: -100px;
      opacity: 0.12;
    }

    @keyframes floatPulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.15) translate(30px, -20px); }
    }

    /* Container Central */
    .main-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 4rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-logo-frame {
      width: 280px;
      max-width: 88vw;
      height: 110px;
      border-radius: 24px;
      padding: 3px;
      background: var(--orange-gradient);
      box-shadow: 0 12px 35px rgba(255, 106, 0, 0.35);
      margin-bottom: 2rem;
      animation: logoFloat 4s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-inner {
      width: 100%;
      height: 100%;
      border-radius: 21px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      box-sizing: border-box;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Badge de Status */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1.25rem;
      background: rgba(255, 106, 0, 0.1);
      border: 1px solid var(--border-accent);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--orange-light);
      margin-bottom: 1.5rem;
      backdrop-filter: blur(12px);
    }

    .status-pulse {
      width: 9px;
      height: 9px;
      background-color: var(--accent-pulse);
      border-radius: 50%;
      position: relative;
    }

    .status-pulse::after {
      content: '';
      position: absolute;
      inset: -4px;
      background-color: var(--accent-pulse);
      border-radius: 50%;
      opacity: 0.75;
      animation: pulsePing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes pulsePing {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* Título e Subtítulo Neutro */
    .title-construction {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .text-gradient {
      background: var(--orange-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline;
    }

    .subtitle-soon {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 1rem;
    }

    /* Rodapé com contatos neutros */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border-subtle);
      padding: 2.5rem 1.5rem 2rem;
      background: rgba(10, 13, 20, 0.85);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .footer-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
    }

    .footer-brand {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 600;
    }

    .footer-contacts-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer-contacts-list a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-contacts-list a:hover {
      color: var(--orange-light);
    }

    .contact-sep {
      color: var(--border-subtle);
    }
  </style>
</head>
<body>

  <!-- Fundos e Luzes Ambiente -->
  <div class="bg-lights">
    <div class="light-orb light-orb-1"></div>
    <div class="light-orb light-orb-2"></div>
  </div>

  <!-- Conteúdo Principal Neutro -->
  <main class="main-wrapper">
    
    <div class="brand-logo-frame">
      <div class="brand-logo-inner">
        <img src="assets/images/baytaka-logo-raw.jpg" alt="Baytaka Interiores" class="brand-logo-img">
      </div>
    </div>

    <div class="status-badge">
      <span class="status-pulse"></span>
      Em Construção
    </div>

    <h1 class="title-construction">
      <span class="text-gradient">Em Construção</span>
    </h1>

    <p class="subtitle-soon">
      Volte em breve.
    </p>

  </main>

  <!-- Rodapé com contatos institucionais neutros -->
  <footer>
    <div class="footer-container">
      <div class="footer-brand">
        <strong>Baytaka Interiores</strong> • Mobiliários e Estruturas para Grandes Eventos
      </div>

      <div class="footer-contacts-list">
        <span>📍 Porto Ferreira - SP</span>
        <span class="contact-sep">•</span>
        <a href="https://api.whatsapp.com/send?phone=5519998418000" target="_blank" rel="noopener noreferrer">
          📱 WhatsApp: <strong>(19) 99841-8000</strong>
        </a>
        <span class="contact-sep">•</span>
        <a href="tel:551935812200">
          📞 Fone: (19) 3581-2200
        </a>
        <span class="contact-sep">•</span>
        <a href="mailto:comercial@baytaka.com.br">
          ✉️ comercial@baytaka.com.br
        </a>
        <span class="contact-sep">•</span>
        <a href="https://www.instagram.com/baytaka.interiores/" target="_blank" rel="noopener noreferrer">
          📸 @baytaka.interiores
        </a>
      </div>
    </div>
  </footer>

</body>
</html>
